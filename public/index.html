<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rek Khmer Multiplayer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="menuScreen" class="overlay active">
  <h1>Rek Khmer ♟️</h1>

  <div style="margin-bottom:8px;">
    <button id="createRoomBtn">Create Room</button>
    <input id="joinRoomInput" placeholder="Enter room ID" style="padding:6px;margin-left:10px;">
    <button id="joinRoomBtn">Join Room</button>
  </div>

  <div id="createdRoomInfo" style="margin-bottom:10px; color: #9ae6b4;"></div>

  <h3>Available Rooms</h3>
  <ul id="roomList"></ul>

  <button id="howBtn">How to Play</button>
  <div id="howText" class="overlay hidden">
    <h2>How to Play</h2>
    <p>Move pieces like a rook.</p>
    <p>Rek Capture: Move between two enemy pieces → capture both.</p>
    <p>Trapping: Surround enemy → capture.</p>
    <button id="closeHow">Back</button>
  </div>
</div>

<div id="gameScreen" class="overlay hidden">
  <h1>Rek Khmer</h1>
  <div>Room: <span id="currentRoom">—</span> | You: <span id="youColor">—</span> | Turn: <span id="turn">—</span></div>
  <div id="board"></div>
  <div id="chat">
    <div id="chatMessages"></div>
    <input type="text" id="chatInput" placeholder="Type message...">
    <button id="chatSend">Send</button>
  </div>
</div>

<div id="endScreen" class="overlay hidden">
  <h1 id="endMessage"></h1>
  <button id="menuReturnBtn">Return to Menu</button>
</div>
<!-- WIN POPUP -->
<div id="winPopup" class="popup hidden">
  <div class="popup-content">
    <h2 id="winnerText">You Win!</h2>
    <div id="popupButtons">
      <button id="playAgainBtn" class="btn">Play Again</button>
      <button id="exitBtn" class="btn">Exit</button>
    </div>
    <p id="waitingText" class="hidden">Waiting for the other player...</p>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
